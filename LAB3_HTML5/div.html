<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Div Structure</title>
  <style>
    /* Styling to visualize the div layout clearly */
    div {
      padding: 12px;
      margin-bottom: 8px;
    }
    #header { background-color: #d1e7dd; }
    #nav { background-color: #cfe2ff; }
    #content { background-color: #fff3cd; }
    #sidebar { background-color: #e2e3e5; }
    #footer { background-color: #f8d7da; }
  </style>
</head>
<body>
  <div id="header">Header Section</div>
  <div id="nav">Navigation Bar</div>
  <div id="content">Main Content Area</div>
  <div id="sidebar">Sidebar Content</div>
  <div id="footer">Footer Section</div>
</body>
</html>
