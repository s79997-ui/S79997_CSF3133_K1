<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block and Inline Elements</title>
</head>
<body>
  <!-- Block Elements: Takes full width, pushes next item to a new line -->
  <h1>Block Elements</h1>
  <div>This is a block element</div>
  <p>This is a paragraph (block element)</p>
  <ul>
    <li>List item 1</li>
    <li>List item 2</li>
  </ul>

  <!-- Inline Elements: Fits into text flow, stays on the same line -->
  <h2>Inline Elements</h2>
  <span>This is an inline element</span>
  <a href="#">This is a link (inline element)</a>
  <strong>This is bold text (inline element)</strong>
</body>
</html>
