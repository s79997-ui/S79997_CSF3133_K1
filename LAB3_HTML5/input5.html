<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Input Elements</title>
</head>
<body>
  <form action="">
    <label for="color">Pilih warna kegemaran anda:</label>
    <input type="color" id="color" name="warnapilihan"><br><br>

    <label for="search">Carian:</label>
    <input type="search" id="search" name="carian"><br><br>

    <label for="date">Tarikh:</label>
    <input type="date" id="date" name="tarikh"><br><br>

    <label for="time">Masa:</label>
    <input type="time" id="time" name="masa"><br><br>

    <label for="month">Bulan dan Tahun:</label>
    <input type="month" id="month" name="bulandantahun"><br><br>

    <label for="url">Laman Web:</label>
    <input type="url" id="url" name="lamanweb"><br><br>

    <label for="week">Minggu:</label>
    <input type="week" id="week" name="minggu"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="useremail"><br><br>

    <input type="submit" value="Hantar">
  </form>
</body>
</html>
