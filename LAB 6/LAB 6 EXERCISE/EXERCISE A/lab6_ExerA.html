<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata and external CSS link -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Game header with title and short instruction -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper, or Scissors.</p>
        </header>

        <!-- Player name input and Start Game button -->
        <section id="player-section" class="card">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button type="button" onclick="startGame()">Start Game</button>
            <p id="welcomeMsg"></p>
        </section>

        <!-- Choice buttons and player/computer images -->
        <section id="game-section" class="card">
            <div class="choices">
                <button type="button" onclick="playRound('rock')">Rock</button>
                <button type="button" onclick="playRound('paper')">Paper</button>
                <button type="button" onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="arena">
                <div class="fighter">
                    <h3>You</h3>
                    <img id="playerImg" src="rock.png" alt="Player choice">
                </div>
                <div class="vs">VS</div>
                <div class="fighter">
                    <h3>Computer</h3>
                    <img id="computerImg" src="rock.png" alt="Computer choice">
                </div>
            </div>
        </section>

        <!-- Round result message and score counters -->
        <section id="result-section" class="card">
            <p id="result">No round played yet.</p>
            <div class="scoreboard">
                <span>Wins: <span id="wins">0</span></span>
                <span>Losses: <span id="losses">0</span></span>
                <span>Draws: <span id="draws">0</span></span>
            </div>
        </section>

        <!-- Round history table and summary/reset controls -->
        <section id="history-section" class="card">
            <h2>History</h2>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>

            <div class="actions">
                <button type="button" onclick="showSummary()">Show Summary</button>
                <button type="button" onclick="resetGame()">Reset</button>
            </div>
            <p id="summaryText"></p>
        </section>

        <!-- Footer with session start time and copyright -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Computer Science Club</p>
        </footer>
    </div>

    <!-- Link external JavaScript file before closing body -->
    <script src="game.js"></script>
</body>
</html>
