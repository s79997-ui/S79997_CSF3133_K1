<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata and external stylesheet link -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Grade Calculator</h2>

        <!-- Return boolean from checkMark() to prevent page reload -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="mark">Mark (0-100):</label>
                <input type="text" id="mark" name="mark">
            </div>

            <div class="btn-row">
                <button type="submit">Check Grade</button>
                <!-- Button to fill a random mark from 0 to 100 -->
                <button type="button" onclick="randomMark()">Random Mark</button>
            </div>
        </form>

        <!-- Result message and timestamp display -->
        <p id="result"></p>
        <p id="checkedAt"></p>

        <!-- Button and container for the grade reference table -->
        <button type="button" onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </div>

    <!-- Link external JavaScript file -->
    <script src="grade.js"></script>
</body>
</html>
